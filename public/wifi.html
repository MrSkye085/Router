<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wi-Fi • Home Gateway</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">
  <aside class="sidebar">
    <div class="brand"><i class="fas fa-wifi"></i><div><span>Home Gateway</span><small>N300 Router v2.1</small></div></div>
    <a href="/dashboard" class="nav-link"><i class="fas fa-gauge-high"></i><span>Dashboard</span></a>
    <a href="/wifi" class="nav-link active"><i class="fas fa-wifi"></i><span>Wi-Fi</span></a>
    <a href="/devices" class="nav-link"><i class="fas fa-laptop"></i><span>Devices</span></a>
    <a href="/security" class="nav-link"><i class="fas fa-shield-halved"></i><span>Security</span></a>
    <a href="/system" class="nav-link"><i class="fas fa-gear"></i><span>System</span></a>
    <a href="#" id="logoutBtn" class="nav-link logout"><i class="fas fa-right-from-bracket"></i><span>Logout</span></a>
  </aside>

  <main class="main">
    <h1 class="page-title"><i class="fas fa-wifi"></i> Wi-Fi Settings</h1>
    <p class="page-subtitle">Configure your wireless network</p>

    <div class="card">
      <h3><i class="fas fa-tower-broadcast"></i> 2.4 GHz Network</h3>
      <form id="wifiForm">
        <div class="form-row">
          <div class="form-field">
            <label>SSID (Network Name)</label>
            <input type="text" name="ssid" id="ssid">
          </div>
          <div class="form-field">
            <label>Password</label>
            <input type="text" name="wifi_password" id="wifi_password">
          </div>
          <div class="form-field">
            <label>Channel</label>
            <select name="channel" id="channel">
              <option>1</option><option>6</option><option>11</option>
            </select>
          </div>
          <div class="form-field">
            <label>Security Mode</label>
            <select name="security_mode" id="security_mode">
              <option>WPA2-PSK</option><option>WPA3-PSK</option><option>WPA/WPA2 Mixed</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn"><i class="fas fa-floppy-disk"></i> Save</button>
      </form>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    async function load() {
      const res = await fetch('/api/settings');
      const { settings } = await res.json();
      ['ssid', 'wifi_password', 'channel', 'security_mode'].forEach(k => {
        const el = document.getElementById(k);
        if (el && settings[k]) el.value = settings[k];
      });
    }
    load();

    document.getElementById('wifiForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const out = await res.json();
      toast(out.success ? 'Wi-Fi settings saved ✓' : 'Save failed', !out.success);
    });

    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/logout', { method: 'POST' });
      window.location.href = '/';
    });

    function toast(msg, error = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (error ? ' error' : '');
      setTimeout(() => t.className = 'toast', 2500);
    }
  </script>
</body>
</html>
